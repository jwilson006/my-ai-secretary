<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Sky Surfer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #05050f;
    display: flex; justify-content: center; align-items: center;
    overflow: hidden; touch-action: none;
  }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// --- Sizing ---
let W, H, GROUND, SCALE;
function resize() {
  W = Math.min(window.innerWidth, 430);
  H = Math.min(window.innerHeight, 780);
  canvas.width  = W;
  canvas.height = H;
  SCALE  = W / 390;
  GROUND = H * 0.72;
}
resize();
window.addEventListener('resize', () => { resize(); initLevel(); });

// --- Constants ---
const G = 0.55;
const JUMP_VEL   = -13.5;
const JUMP2_VEL  = -11;
const MAX_SPEED  = 14;
const BASE_SPEED = 4;

// --- State ---
let state  = 'start'; // start | play | dead
let score  = 0;
let best   = +localStorage.getItem('skySurferBest') || 0;
let frame  = 0;
let speed  = BASE_SPEED;
let obstacles = [];
let particles = [];
let stars     = [];
let groundDots = [];
let bgMountains = [];
let bgMountains2 = [];
let scoreTimer = 0;

// --- Player ---
const P = {
  x: 0, y: 0, vy: 0,
  w: 38, h: 46,
  jumps: 0, maxJumps: 2,
  trail: [],
  flash: 0
};

// --- Init / Level Reset ---
function initLevel() {
  P.x = W * 0.22;
  P.y = GROUND - P.h;
  P.vy = 0;
  P.jumps = 0;
  P.trail = [];
  P.flash = 0;
  obstacles = [];
  particles = [];
  score = 0;
  frame = 0;
  speed = BASE_SPEED;
  scoreTimer = 0;
}

function initWorld() {
  stars = [];
  for (let i = 0; i < 80; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * GROUND * 0.95,
      r: Math.random() * 1.4 + 0.3,
      phase: Math.random() * Math.PI * 2,
      speed: Math.random() * 0.02 + 0.01
    });
  }
  groundDots = [];
  for (let i = 0; i < 30; i++) {
    groundDots.push({ x: Math.random() * W, h: Math.random() * 8 + 4 });
  }
  bgMountains = buildMountains(5, 0.5, 0.25, '#0e1e3a');
  bgMountains2 = buildMountains(7, 0.7, 0.18, '#122040');
}

function buildMountains(count, yFac, hFac, color) {
  const peaks = [];
  const segW = W / count;
  for (let i = 0; i <= count; i++) {
    peaks.push({
      x: i * segW + (Math.random() - 0.5) * segW * 0.5,
      y: GROUND * yFac - Math.random() * GROUND * hFac,
      color
    });
  }
  return peaks;
}

initWorld();
initLevel();

// --- Input ---
function handleJump() {
  if (state === 'start') { state = 'play'; return; }
  if (state === 'dead')  { state = 'play'; initLevel(); return; }
  if (P.jumps < P.maxJumps) {
    P.vy = P.jumps === 0 ? JUMP_VEL : JUMP2_VEL;
    P.jumps++;
    spawnJumpParticles();
  }
}

document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); handleJump(); }
});
canvas.addEventListener('touchstart', e => { e.preventDefault(); handleJump(); }, { passive: false });
canvas.addEventListener('mousedown',  e => { handleJump(); });

// --- Particles ---
function spawnJumpParticles() {
  const color = P.jumps > 1 ? '#ff9f43' : '#54a0ff';
  for (let i = 0; i < 10; i++) {
    particles.push({
      x: P.x + P.w / 2, y: P.y + P.h,
      vx: (Math.random() - 0.5) * 5,
      vy:  Math.random() * 3,
      r: Math.random() * 4 + 2,
      life: 1, color
    });
  }
}

function spawnDeathParticles() {
  for (let i = 0; i < 30; i++) {
    const hue = Math.random() < 0.5 ? '10' : '200';
    particles.push({
      x: P.x + P.w / 2, y: P.y + P.h / 2,
      vx: (Math.random() - 0.5) * 10,
      vy: (Math.random() - 0.5) * 10,
      r: Math.random() * 6 + 2,
      life: 1,
      color: `hsl(${hue},90%,65%)`
    });
  }
}

// --- Obstacles ---
function maybeSpawn() {
  const interval = Math.max(55, 130 - score * 3);
  if (frame % interval !== 0) return;

  const choices = score < 8 ? ['low'] : ['low','high','gap'];
  const type = choices[Math.floor(Math.random() * choices.length)];

  if (type === 'low') {
    obstacles.push(makeCrystal(W + 10, GROUND - 48, 26, 58, '#ee5a24'));
  } else if (type === 'high') {
    obstacles.push(makeCrystal(W + 10, GROUND - 110, 22, 50, '#f9ca24'));
  } else {
    obstacles.push(makeCrystal(W + 10,      GROUND - 50,  24, 56, '#ee5a24'));
    obstacles.push(makeCrystal(W + 10 + 70, GROUND - 105, 20, 46, '#f9ca24'));
  }
}

function makeCrystal(x, y, w, h, color) {
  return { x, y, w, h, color, glow: 0, glowDir: 1 };
}

// --- Collision ---
function hits(a, b) {
  const pad = 7;
  return a.x + pad < b.x + b.w - pad &&
         a.x + a.w - pad > b.x + pad &&
         a.y + pad < b.y + b.h - pad &&
         a.y + a.h - pad > b.y + pad;
}

// --- Update ---
function update() {
  frame++;
  if (state !== 'play') return;

  speed = Math.min(BASE_SPEED + score * 0.18, MAX_SPEED);

  // Player
  P.vy += G;
  P.y  += P.vy;
  P.flash = Math.max(0, P.flash - 1);

  P.trail.unshift({ x: P.x, y: P.y });
  if (P.trail.length > 7) P.trail.pop();

  if (P.y + P.h >= GROUND) {
    P.y = GROUND - P.h;
    P.vy = 0;
    P.jumps = 0;
  }
  if (P.y < -P.h) { P.y = -P.h; P.vy = 0; }

  // Obstacles
  maybeSpawn();
  for (let i = obstacles.length - 1; i >= 0; i--) {
    const o = obstacles[i];
    o.x -= speed;
    o.glow += 0.08 * o.glowDir;
    if (o.glow > 1 || o.glow < 0) o.glowDir *= -1;
    if (o.x + o.w < -20) { obstacles.splice(i, 1); continue; }
    if (hits(P, o)) {
      state = 'dead';
      if (score > best) { best = score; localStorage.setItem('skySurferBest', best); }
      spawnDeathParticles();
    }
  }

  // Score (every 20 frames)
  scoreTimer++;
  if (scoreTimer >= 20) { score++; scoreTimer = 0; }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x  += p.vx;
    p.y  += p.vy;
    p.vy += 0.2;
    p.life -= 0.035;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // Ground dots scroll
  groundDots.forEach(d => {
    d.x -= speed * 0.6;
    if (d.x < -4) d.x += W + 8;
  });
}

// --- Draw Helpers ---
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y,     x + w, y + r,     r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x,     y + h, x,     y + h - r, r);
  ctx.lineTo(x,     y + r);
  ctx.arcTo(x,     y,     x + r, y,         r);
  ctx.closePath();
  ctx.fill();
}

// --- Draw Background ---
function drawBG() {
  const sky = ctx.createLinearGradient(0, 0, 0, GROUND);
  sky.addColorStop(0,   '#02020c');
  sky.addColorStop(0.6, '#060d28');
  sky.addColorStop(1,   '#0d1f45');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, GROUND);

  // Stars
  stars.forEach(s => {
    if (state === 'play') s.x -= speed * 0.04;
    if (s.x < -2) s.x += W + 4;
    s.phase += s.speed;
    const a = 0.45 + Math.sin(s.phase) * 0.45;
    ctx.fillStyle = `rgba(255,255,255,${a})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  });

  // Far mountains
  drawMountainRange(bgMountains,  speed * 0.07);
  drawMountainRange(bgMountains2, speed * 0.14);
}

let mScroll1 = 0, mScroll2 = 0;
function drawMountainRange(peaks, scrollSpeed) {
  if (state === 'play') {
    if (peaks === bgMountains)  mScroll1 += scrollSpeed;
    else                        mScroll2 += scrollSpeed;
  }
  const scroll = peaks === bgMountains ? mScroll1 : mScroll2;
  ctx.fillStyle = peaks[0].color;
  ctx.beginPath();
  ctx.moveTo(0, GROUND);
  peaks.forEach((p, i) => {
    const px = ((p.x - scroll % W) + W) % W;
    if (i === 0) ctx.lineTo(px, p.y);
    else ctx.lineTo(px, p.y);
  });
  ctx.lineTo(W, GROUND);
  ctx.closePath();
  ctx.fill();
}

function drawGround() {
  const g = ctx.createLinearGradient(0, GROUND, 0, H);
  g.addColorStop(0,   '#1e4d2b');
  g.addColorStop(0.4, '#122e19');
  g.addColorStop(1,   '#060f09');
  ctx.fillStyle = g;
  ctx.fillRect(0, GROUND, W, H - GROUND);

  // Glowing ground line
  ctx.strokeStyle = '#2ecc71';
  ctx.lineWidth = 2;
  ctx.shadowColor = '#2ecc71';
  ctx.shadowBlur = 8;
  ctx.beginPath();
  ctx.moveTo(0, GROUND); ctx.lineTo(W, GROUND);
  ctx.stroke();
  ctx.shadowBlur = 0;

  // Ground tufts
  ctx.fillStyle = '#27ae60';
  groundDots.forEach(d => {
    ctx.beginPath();
    ctx.moveTo(d.x, GROUND);
    ctx.lineTo(d.x + 3, GROUND - d.h);
    ctx.lineTo(d.x + 6, GROUND);
    ctx.fill();
  });
}

// --- Draw Player ---
function drawPlayer() {
  const bob = state === 'play' ? Math.sin(frame * 0.12) * 2 : 0;
  const px = P.x, py = P.y + bob;

  // Trail
  P.trail.forEach((t, i) => {
    ctx.globalAlpha = (i / P.trail.length) * 0.25;
    ctx.fillStyle = '#54a0ff';
    ctx.fillRect(t.x + 4, t.y + 4 + bob, P.w - 8, P.h - 8);
  });
  ctx.globalAlpha = 1;

  // Jetpack flames (when airborne & moving up)
  if (P.vy < 0 && state === 'play') {
    const fh = Math.abs(P.vy) * 2.2;
    const fc = P.jumps > 1 ? `hsl(${30 + frame * 5 % 30},100%,60%)` : `hsl(${200 + frame*3%40},100%,65%)`;
    ctx.fillStyle = fc;
    ctx.globalAlpha = 0.8;
    // left pack
    ctx.beginPath();
    ctx.ellipse(px + 6, py + P.h + fh/2, 4, fh/2 + 2, 0, 0, Math.PI*2);
    ctx.fill();
    // right pack
    ctx.beginPath();
    ctx.ellipse(px + P.w - 6, py + P.h + fh/2, 4, fh/2 + 2, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // Suit body
  ctx.fillStyle = '#dfe6e9';
  ctx.fillRect(px + 2, py + 18, P.w - 4, P.h - 22);

  // Jetpack
  ctx.fillStyle = '#636e72';
  ctx.fillRect(px + 6,      py + 20, 8, 16);
  ctx.fillRect(px + P.w-14, py + 20, 8, 16);

  // Arms
  const swing = state === 'play' ? Math.sin(frame * 0.25) * 6 : 0;
  ctx.fillStyle = '#b2bec3';
  ctx.fillRect(px - 5,     py + 20 + swing, 8, 14);
  ctx.fillRect(px + P.w-3, py + 20 - swing, 8, 14);

  // Legs
  ctx.fillStyle = '#b2bec3';
  const legSwing = state === 'play' ? Math.sin(frame * 0.25) * 4 : 0;
  ctx.fillRect(px + 4,        py + P.h - 8, 11, 12);
  ctx.fillRect(px + P.w - 15, py + P.h - 8, 11, 12);

  // Helmet
  ctx.fillStyle = '#ecf0f1';
  ctx.beginPath();
  ctx.ellipse(px + P.w/2, py + 10, P.w/2 - 1, 14, 0, 0, Math.PI*2);
  ctx.fill();

  // Visor
  const visorGrad = ctx.createLinearGradient(px + 8, py + 4, px + P.w - 8, py + 18);
  visorGrad.addColorStop(0, '#54a0ff');
  visorGrad.addColorStop(1, '#2980b9');
  ctx.fillStyle = visorGrad;
  ctx.beginPath();
  ctx.ellipse(px + P.w/2, py + 10, P.w/2 - 6, 9, 0, 0, Math.PI*2);
  ctx.fill();

  // Visor shine
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.beginPath();
  ctx.ellipse(px + P.w/2 - 4, py + 6, 5, 3, -0.4, 0, Math.PI*2);
  ctx.fill();
}

// --- Draw Obstacles ---
function drawObstacle(o) {
  const glow = 0.4 + o.glow * 0.6;
  ctx.shadowColor = o.color;
  ctx.shadowBlur  = 12 * glow;

  // Body
  const gr = ctx.createLinearGradient(o.x, o.y, o.x + o.w, o.y + o.h);
  gr.addColorStop(0,   lighten(o.color, 40));
  gr.addColorStop(0.4, o.color);
  gr.addColorStop(1,   darken(o.color, 30));
  ctx.fillStyle = gr;
  ctx.fillRect(o.x, o.y, o.w, o.h);

  // Crystal spike top
  ctx.fillStyle = lighten(o.color, 20);
  ctx.beginPath();
  ctx.moveTo(o.x, o.y);
  ctx.lineTo(o.x + o.w / 2, o.y - 20);
  ctx.lineTo(o.x + o.w, o.y);
  ctx.closePath();
  ctx.fill();

  // Facet shine
  ctx.fillStyle = 'rgba(255,255,255,0.22)';
  ctx.fillRect(o.x + 3, o.y + 4, 6, o.h - 8);

  ctx.shadowBlur = 0;
}

function lighten(hex, amt) {
  const [r,g,b] = hexRGB(hex);
  return `rgb(${Math.min(r+amt,255)},${Math.min(g+amt,255)},${Math.min(b+amt,255)})`;
}
function darken(hex, amt) {
  const [r,g,b] = hexRGB(hex);
  return `rgb(${Math.max(r-amt,0)},${Math.max(g-amt,0)},${Math.max(b-amt,0)})`;
}
function hexRGB(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

// --- Draw Particles ---
function drawParticles() {
  particles.forEach(p => {
    ctx.globalAlpha = p.life;
    ctx.fillStyle   = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
}

// --- HUD ---
function drawHUD() {
  // Score pill
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  rr(W/2 - 80, 14, 160, 42, 14);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff';
  ctx.font = `bold ${Math.round(18 * SCALE)}px monospace`;
  ctx.fillText(`SCORE  ${score}`, W/2, 43);

  // Best
  ctx.font = `${Math.round(12 * SCALE)}px monospace`;
  ctx.fillStyle = '#f9ca24';
  ctx.fillText(`BEST ${best}`, W/2, 68);

  // Jump indicator dots
  for (let i = 0; i < P.maxJumps; i++) {
    ctx.fillStyle = i < (P.maxJumps - P.jumps) ? '#2ecc71' : 'rgba(255,255,255,0.2)';
    ctx.beginPath();
    ctx.arc(W - 28 + i * 16, H - 28, 6, 0, Math.PI * 2);
    ctx.fill();
  }
}

// --- Screens ---
function drawStart() {
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(0, 0, W, H);

  const cx = W / 2, cy = H / 2;

  // Card
  ctx.fillStyle = 'rgba(5,10,30,0.92)';
  rr(cx - 160, cy - 190, 320, 300, 24);

  // Border glow
  ctx.strokeStyle = '#54a0ff';
  ctx.lineWidth = 1.5;
  ctx.shadowColor = '#54a0ff';
  ctx.shadowBlur = 16;
  ctx.beginPath();
  ctx.roundRect(cx - 160, cy - 190, 320, 300, 24);
  ctx.stroke();
  ctx.shadowBlur = 0;

  ctx.textAlign = 'center';

  ctx.fillStyle = '#54a0ff';
  ctx.font = `bold ${Math.round(46 * SCALE)}px monospace`;
  ctx.fillText('SKY', cx, cy - 110);
  ctx.fillStyle = '#f9ca24';
  ctx.fillText('SURFER', cx, cy - 55);

  ctx.fillStyle = 'rgba(255,255,255,0.65)';
  ctx.font = `${Math.round(14 * SCALE)}px monospace`;
  ctx.fillText('Dodge the crystals!', cx, cy - 15);

  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.font = `${Math.round(11 * SCALE)}px monospace`;
  ctx.fillText('Tap once = jump  |  Tap again = double jump', cx, cy + 15);

  const pulse = 0.65 + Math.sin(frame * 0.06) * 0.35;
  ctx.fillStyle = `rgba(255,255,255,${pulse})`;
  ctx.font = `bold ${Math.round(18 * SCALE)}px monospace`;
  ctx.fillText('TAP TO START', cx, cy + 70);

  if (best > 0) {
    ctx.fillStyle = 'rgba(249,202,36,0.85)';
    ctx.font = `${Math.round(13 * SCALE)}px monospace`;
    ctx.fillText(`Best Score: ${best}`, cx, cy + 105);
  }
}

function drawDead() {
  ctx.fillStyle = 'rgba(0,0,0,0.62)';
  ctx.fillRect(0, 0, W, H);

  const cx = W / 2, cy = H / 2;

  ctx.fillStyle = 'rgba(20,5,5,0.93)';
  rr(cx - 155, cy - 175, 310, 280, 24);

  ctx.strokeStyle = '#ee5a24';
  ctx.lineWidth = 1.5;
  ctx.shadowColor = '#ee5a24';
  ctx.shadowBlur = 16;
  ctx.beginPath();
  ctx.roundRect(cx - 155, cy - 175, 310, 280, 24);
  ctx.stroke();
  ctx.shadowBlur = 0;

  ctx.textAlign = 'center';
  ctx.fillStyle = '#ee5a24';
  ctx.font = `bold ${Math.round(44 * SCALE)}px monospace`;
  ctx.fillText('GAME', cx, cy - 100);
  ctx.fillText('OVER', cx, cy - 48);

  ctx.fillStyle = '#fff';
  ctx.font = `${Math.round(18 * SCALE)}px monospace`;
  ctx.fillText(`Score: ${score}`, cx, cy + 8);

  if (score > 0 && score === best) {
    ctx.fillStyle = '#f9ca24';
    ctx.font = `bold ${Math.round(16 * SCALE)}px monospace`;
    ctx.fillText('NEW BEST!', cx, cy + 40);
  } else {
    ctx.fillStyle = '#f9ca24';
    ctx.font = `${Math.round(15 * SCALE)}px monospace`;
    ctx.fillText(`Best: ${best}`, cx, cy + 40);
  }

  const pulse = 0.65 + Math.sin(frame * 0.06) * 0.35;
  ctx.fillStyle = `rgba(255,255,255,${pulse})`;
  ctx.font = `bold ${Math.round(17 * SCALE)}px monospace`;
  ctx.fillText('TAP TO RETRY', cx, cy + 90);
}

// --- Main Loop ---
function loop() {
  update();

  drawBG();
  drawGround();

  obstacles.forEach(drawObstacle);

  if (state !== 'dead') drawPlayer();

  drawParticles();

  if (state === 'play') drawHUD();
  if (state === 'start') drawStart();
  if (state === 'dead')  drawDead();

  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
